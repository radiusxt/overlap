name: Run Tests

on:
  # Triggers on pushes to main
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest

    env:
      # Pings live production database with read-only permissions
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_READONLY_DB_URL }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx vitest run tests/api

  backend:
    runs-on: ubuntu-latest
 
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
 
    env:
      # Throwaway CI-only Postgres — never use the real Supabase project
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
 
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "data/requirements.txt"
      - run: pip install -r data/requirements.txt
      - working-directory: data
        run: python -m pytest -v
 