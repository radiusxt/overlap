name: Run Tests

on:
  # Triggers on pushes to main
  push:
    branches: [main]

jobs:
  # API Tests
  api:
    runs-on: ubuntu-latest

    env:
      # Pings production database with read-only permissions
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_READONLY_DB_URL }}

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/api

  # DB Tests
  db:
    runs-on: ubuntu-latest
 
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
 
    env:
      # Throwaway CI-only Postgres — never use the real Supabase project
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
 
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "data/uv.lock"
      - run: uv sync --locked
        working-directory: data
      - working-directory: data
        run: uv run pytest -v
 