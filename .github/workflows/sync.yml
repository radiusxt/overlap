name: Database Sync

on:
  schedule:
    # Triggers on weekdays at 21:07 UTC / 17:07 UTC-4 (NYC) / 07:07 UTC+10 (BNE)
    - cron: "7 21 * * 1-5"
  # Can be manually triggered for testing purposes or urgent updates
  workflow_dispatch:

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r data/requirements.txt
      - run: python data/sync.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          