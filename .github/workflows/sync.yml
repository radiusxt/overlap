name: Database Sync

on:
  schedule:
    # Triggers on weekdays at 20:13 UTC / 16:13 UTC-4 (NYC) / 06:13 UTC+10 (BNE)
    - cron: "13 20 * * 1-5"
  # Can be manually triggered for testing purposes or urgent updates
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "data/uv.lock"
      - run: uv sync --locked --project data
      - run: uv run --project data data/sync.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          