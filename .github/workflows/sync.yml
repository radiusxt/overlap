name: Database Sync

on:
  schedule:
    # Triggers on weekdays at 20:22 UTC / 16:22 UTC-4 (NYC) / 06:22 UTC+10 (BNE)
    - cron: "22 20 * * 1-5"
  # Can be manually triggered for testing purposes or urgent updates
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "data/requirements.txt"
      - run: pip install -r data/requirements.txt
      - run: python data/sync.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          