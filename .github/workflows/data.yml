name: Data Update

on:
  schedule:
    # Triggers Daily at 22:00 UTC / 18:00 UTC-4 (NYC) / 08:00 UTC+10 (BNE)
    - cron: "0 22 * * *"   
  workflow_dispatch:        # lets you trigger it manually from the GitHub UI, for testing

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r data/requirements.txt
      - run: python data/data.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          