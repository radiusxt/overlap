name: Data Update

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC daily = your 6pm UTC-4 / 8am UTC+10
  workflow_dispatch:        # lets you trigger it manually from the GitHub UI, for testing

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r data/requirements.txt
      - run: python data/data.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          